name: ci
on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege: the job only reads the repo (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (editable + dev)
        run: pip install -e '.[dev]'
      - name: Tests
        run: pytest -q
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy — advisory)
        # advisory until the codebase is fully strict; fails don't block merge
        continue-on-error: true
        run: mypy puca
