[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "puca"
version = "0.1.0"
description = "Puca — a white-hat, OWASP-mapped security testing kit for web, API, and agentic/MCP systems."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kevin Murphy", email = "kevin@round-tower.ie" }]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
puca = "puca.cli:main"

[tool.setuptools.packages.find]
include = ["puca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# requests + yaml have types-* in dev; strict enough to catch real drift
# without flagging every untyped def in the test harness.
